; KnC GameServer Configuration
; This file configures a single game server instance

[Server]
; Unique server ID (must be unique per instance)
id = 1

; Display name shown in server list
name = KnC World 1

; Public IP/hostname for clients to connect
; Use 0.0.0.0 to bind all interfaces, but specify public IP for registration
host = 127.0.0.1

; Game server port (clients connect here)
port = 50018

; Internal port for LoginServer communication
internal_port = 50100

; Maximum concurrent players
max_players = 100

; Server type: 0=normal, 1=newbie, 2=pvp, 3=event
type = 0

[LoginServer]
; LoginServer address for registration
host = 127.0.0.1
port = 50017

; Registration key (shared secret)
; shared secret set from an environment variable or fill in here never commit a real secret
key =

[Database]
; Database connection (or use LoginServer's DB)
host = localhost
port = 3306
name = knc_emu
user = knc
password = knc_password

[Logging]
; Log level: DEBUG, INFO, WARN, ERROR
level = INFO

; Log file path
file = logs/gameserver.log

