# ---- pilot ----
# agent control channel on named pipe knc_pilot
# drive it with knc-pilot.exe, run  knc-pilot help  for the verb list
#
#   pilot.enabled   pipe server plus window subclass
#   pilot.d3d       hook GetProcAddress so Present can copy the backbuffer,
#                   only used when the gdi capture comes back flat or the
#                   window is minimized, set 0 to keep the client untouched
#
pilot.enabled = 0
pilot.d3d     = 1

# sub_42CA10 draws the slot buttons then repaints two disabled plates over them,
# Common_Top_Quest_03 at 449,4 and Common_Bottom_RoomCraft_03 at 606,731, which is
# exactly where the injected Quest and Room Craft buttons sit. je to jmp skips both
0x0042CC8B | 74 30 | EB 30 | quest and room craft plate off

# CLIENT BUG on the login redirect. sub_476CC0 zeroes BufferedCount then still
# subtracts the frame it just consumed so the count ends at minus that size, and
# sub_476A50 then arms ReadFile at buffer plus a negative offset which lands on the
# OVERLAPPED it is reading with. The world stream shifts and the client never
# finishes the login burst. Clamp the count to zero before the read, through a
# thunk in the int3 pad at 0052F140 since the six bytes on site are not enough.
0x00476A65 | 8B 8E 58 C0 80 00 | E8 D6 86 0B 00 90 | recv count clamp call
0x0052F140 | CC CC CC CC CC CC CC CC CC CC CC CC CC CC CC CC CC CC CC | 8B 8E 58 C0 80 00 85 C9 7D 08 33 C9 89 8E 58 C0 80 00 C3 | recv count clamp thunk
