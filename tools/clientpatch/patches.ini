# KnC client patch table and wire spy
#
# ---- spy ----
# logs every frame both directions into packets log next to the dll
# hooks send and recv inside ws2_32 itself, KnC exe resolves them at runtime
# so an import table hook would see nothing
#
spy.enabled   = 0
spy.hexdump   = 1
spy.maxhex    = 256
spy.heartbeat = 0
# seeds the per car follow camera distance and height, set 0 to see the raw client
spy.camfix    = 1
#
# ---- patches ----
#
# format   address | original bytes | replacement bytes | name
#
# address        absolute VA in the loaded KnC exe, image base 0x400000
# original       bytes expected at that address, patch is SKIPPED if they differ
# replacement    same length as original, no length change allowed
# name           short label, shows up in clientpatch log
#
# a patch that does not match is skipped and logged, never forced
# results land in clientpatch log next to the dll
#
# example
# 0x0047ABCD | 74 12 | EB 12 | quest unlock je to jmp
#
# ---- Failed to connect fix ----
#
# "Failed to connect!" is the MSG_CONNECT_FAIL key and it is NOT a network error.
# The stream read sub_44E910 throws _CxxThrowException "Invalid Read" whenever a
# handler asks for more bytes than the frame carries. The net pump sub_478AD0 wraps
# it all in a try and the catch at 0x478B32 shows MSG_CONNECT_FAIL then tears the
# session down, which is why the box appears over a room that rendered fine and why
# Close crashes. This replaces the throw block with the exact epilogue of the success
# path plus a zero fill of the destination, so a short packet becomes a silent no op
# instead of killing the session.
#
#   mov edi,[esp+10] / mov ecx,edx / xor eax,eax / rep stosb / pop edi esi ebx / ret 8
#
0x0044E9A8 | 68 3C 2D 5C 00 8D 4C 24 18 51 C7 44 24 1C 88 3C | 8B 7C 24 10 8B CA 33 C0 F3 AA 5F 5E 5B C2 08 00 | invalid read no throw

