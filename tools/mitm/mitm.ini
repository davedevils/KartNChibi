# KnC MITM proxy config. Launch the exe next to this file.
#
# Windows reserves 50017 (Hyper-V WinNAT admin range 50000 to 50059) so a normal
# process cannot bind it, the proxy listens on 50617 which is free. Point the
# DevClient at the proxy by setting its network.ini to
#     IP=127.0.0.1
#     Port=50617
# then run the proxy and launch the client, it now talks to the foreign server
# through us with clean two way logs. Set Port back to 50017 to use our own login.
#
# placeholders here real values sit in mitm local ini next to this file git ignored
# copy mitm example ini to start that local file

listen_ip   = 127.0.0.1
listen_port = 50617

# the foreign server the client really talks to placeholder here
target_host = 203.0.113.10
target_port = 50017

# inject  = plant a direct login on connect and drop the client login family so
#           its dead launcher token never fights the auth, use this to actually
#           reach a foreign lobby with our own client
# passthrough = change nothing just log both ways, use this to read the client
#           real login sequence against our own server
mode    = inject
version = 1
user    = changeme
pass    = changeme

log       = mitm_packets.log
maxhex    = 256
heartbeat = 0
