# template for mitm local ini git ignored holds the real values
# copy this file to mitm local ini next to it and fill in the real ones
# shared by the proxy exe relay py and parse pcapng py

listen_ip   = 127.0.0.1
listen_port = 50617

# the foreign server the client really talks to
target_host = 203.0.113.10
target_port = 50017

mode    = inject
version = 1
user    = changeme
pass    = changeme

log       = mitm_packets.log
maxhex    = 256
heartbeat = 0

# relay py the vps side relay leave public ip empty to skip the announce rewrite
relay_listen_port   = 50600
relay_public_ip     =
relay_callback_port = 50601
relay_inject        = 1
