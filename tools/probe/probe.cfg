# KnC probe - character creation / driver catalog investigation.
# Goal: prove the char-create screen crashes because the driver catalog is empty
# (FUN_00473730 does driver = get(rand() % count); count==0 = divide by zero).
# Addresses verified via Ghidra. count lives at driverCatalogObj+0x1b04.
module=KnC.exe
image_base=0x00400000
jsonl=knc_charcreate.jsonl
tcp_port=8077
ring_capacity=4096
max_capture_bytes=256

# driver catalog count getter FUN_0044ffc0 ecx = catalog obj deref +0x1b04 = the count
# THE KEY SIGNAL if this is 0 when char create fires the catalog is empty
hook=drvcount dir=in addr=0x0044FFC0
capture=catobj src=ecx size=4 as=val
capture=count  src=ecx deref=0x1b04 size=4 as=ptr

# char creation screen FUN_00473730 fires on 0x03
hook=charcreate dir=in addr=0x00473730
capture=ecx src=ecx size=4 as=val

# char create precondition FUN_00473650 loads RegistDriver asset
hook=precond dir=in addr=0x00473650

# SetUIState FUN_00404410 to see the state flow around char create
hook=setuistate dir=in addr=0x00404410
capture=state src=arg0 size=4 as=val
